services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod

    container_name: qa-api-prod

    ports:
      - "${PORT}:${PORT}"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DB_HOST: db

    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: qu-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qa_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
