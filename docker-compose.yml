services:
  api:
    build: .
    container_name: qa-api-demo

    env_file:
      - .env

    ports:
      - "${PORT}:${PORT}"

    environment:
      DB_HOST: db

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: qa-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qa_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
